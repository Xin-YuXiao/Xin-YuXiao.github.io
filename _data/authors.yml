# Author display settings used by _includes/widgets/author_list.html.
# Keys must match the author strings in _publications/*.md (without the trailing * or # marks).
#   bold: true   -> render the name in bold (use this for yourself)
#   url: ...     -> link the name to a homepage
#   name: ...    -> display a different name than the key
# Marks in publication files: "Name*" = equal contribution, "Name#" = corresponding author.

"Xin-Yu Xiao":
  bold: true
